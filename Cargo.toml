[workspace]
members = ["crates/cloudlease-core", "crates/cloudlease-provider"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.0"
repository = "https://github.com/avencera/cloudlease"
publish = false

[workspace.dependencies]
cloudlease-core = { path = "crates/cloudlease-core" }
cloudlease-provider = { path = "crates/cloudlease-provider" }
cloudlease-worker = { path = "crates/cloudlease-worker" }
getrandom = { version = "0.3", features = ["wasm_js"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
uuid = { version = "1", features = ["v4", "js"] }
# pinned to rembuild's version so rembuild can depend on these crates directly
worker = "=0.8.5"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
opt-level = "s"
lto = true

[profile.dev]
debug = "line-tables-only"
